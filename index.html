<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbeam</title>
<meta name="description" content="Northbeam is an early-stage startup building AI-powered software with Claude.">
<style>
  :root { --bg:#0e1116; --fg:#e8ecf1; --muted:#8b95a5; --accent:#6ea8ff; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f8fa; --fg:#14181f; --muted:#5b6574; --accent:#1f5fd6; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; justify-content:center;
         background:var(--bg); color:var(--fg);
         font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 24px; }
  .mark { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent);
          box-shadow:0 0 18px var(--accent); margin-right:10px; }
  h1 { font-size:2.25rem; letter-spacing:-0.02em; margin:0 0 16px; }
  p { color:var(--muted); margin:0 0 16px; }
  .tag { font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:12px; }
  footer { max-width:640px; margin:0 auto; padding:0 24px 32px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <div class="tag"><span class="mark"></span>Early stage</div>
  <h1>Northbeam</h1>
  <p>We're building AI-powered software on top of Claude. The product is in development, and this page will be updated as it takes shape.</p>
  <p>Based in Istanbul, Türkiye.</p>
</main>
<footer>&copy; 2026 Northbeam</footer>
</body>
</html>
